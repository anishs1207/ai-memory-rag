services:
  # Database for the system
  db:
    image: postgres:15
    container_name: postgres_db
    restart: always
    environment:
      POSTGRES_USER: user
      POSTGRES_PASSWORD: password
      POSTGRES_DB: agentic_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - inqora-network

  # Redis for image processing queues
  redis:
    image: redis:7
    container_name: redis_cache
    restart: always
    ports:
      - "6379:6379"
    networks:
      - inqora-network

  # Main Server
  server:
    build:
      context: .
      dockerfile: ./apps/server/Dockerfile
    container_name: inqora-server
    ports:
      - "3000:3000"
    environment:
      DATABASE_URL: postgresql://user:password@db:5432/agentic_db?schema=public
    depends_on:
      - db
    networks:
      - inqora-network

  # Image Memory Backend
  image-memory-be:
    build:
      context: .
      dockerfile: ./apps/image-memory-be/Dockerfile
    container_name: inqora-image-memory-be
    ports:
      - "3001:3001"
    environment:
      DATABASE_URL: postgresql://user:password@db:5432/agentic_db?schema=public
      REDIS_HOST: redis
      REDIS_PORT: 6379
      GEMINI_API_KEY: ${GEMINI_API_KEY}
      PORT: 3001
    depends_on:
      - db
      - redis
    networks:
      - inqora-network

  # Web Frontend
  web:
    build:
      context: .
      dockerfile: ./apps/web/Dockerfile
    container_name: inqora-web
    ports:
      - "3005:3000"
    environment:
      NEXT_PUBLIC_API_URL: http://localhost:3001
    depends_on:
      - image-memory-be
      - server
    networks:
      - inqora-network

  # Documentation
  docs:
    build:
      context: .
      dockerfile: ./apps/docs/Dockerfile
    container_name: inqora-docs
    ports:
      - "8080:80"
    networks:
      - inqora-network

networks:
  inqora-network:
    driver: bridge

volumes:
  postgres_data:
