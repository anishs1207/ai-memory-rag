version: '3'

tasks:
  build:
    desc: Build the docker image
    cmds:
      - docker build -t inqora-image-memory-be -f Dockerfile ../..

  start:
    desc: Start the service in development mode
    cmds:
      - npm run start:dev

  up:
    desc: Start the service in a docker container
    cmds:
      - docker run -p 3001:3001 --env-file .env inqora-image-memory-be

  stop:
    desc: Stop the service (docker)
    cmds:
      - docker stop inqora-image-memory-be || true
      - docker rm inqora-image-memory-be || true
