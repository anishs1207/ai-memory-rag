apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: inqora
  namespace: inqora
  annotations:
    nginx.ingress.kubernetes.io/proxy-body-size: 50m
spec:
  ingressClassName: nginx
  rules:
    - http:
        paths:
          - path: /api
            pathType: Prefix
            backend:
              service:
                name: server
                port: {number: 3001}
          - path: /
            pathType: Prefix
            backend:
              service:
                name: web
                port: {number: 3000}
