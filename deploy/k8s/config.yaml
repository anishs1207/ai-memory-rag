apiVersion: v1
kind: ConfigMap
metadata:
  name: inqora-config
  namespace: inqora
data:
  POSTGRES_DB: inqora
  POSTGRES_USER: inqora
  REDIS_HOST: redis
  REDIS_PORT: "6379"
  CORS_ORIGIN: http://localhost:8080
  KUBE_NAMESPACE: workflow-runner
  KUBE_POD_LABEL: app=runner
  ENVIRONMENT: production
  DEBUG: "false"
---
apiVersion: v1
kind: Secret
metadata:
  name: inqora-secrets
  namespace: inqora
type: Opaque
stringData:
  # Local placeholders. Replace through a secret manager in shared clusters.
  POSTGRES_PASSWORD: change-me
  GEMINI_API_KEY: ""
  OPENAI_API_KEY: ""
  ANTHROPIC_API_KEY: ""
  PINECONE_API_KEY: ""
  ALLOWED_API_KEYS: change-me
